env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Deploy sandbox

run-name: "Deploy sandbox${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}${{ inputs.private_pr && format(' — branch proof {0} (PR #{1})', inputs.private_ref, inputs.private_pr) || '' }}"

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Which sandbox Worker to deploy: all, platform, or one app Worker name that tooling/ci/worker-set.mjs --for-deploy --json --app-workers --env sandbox prints. The workers job refuses any other value."
        required: false
        default: all
        type: string
      private_pr:
        description: "A private_ref branch run only: the number of the private pull request whose head that branch is (its CI run is the gate). Empty for main."
        required: false
        default: ''
        type: string
      worker_slot:
        description: 'Set by the platform Worker cron only: the slot of record it fired for. Empty on a hand dispatch.'
        required: false
        default: ''
        type: string
      private_ref:
        description: The PRIVATE ref this run builds, refs/heads/<branch> (generated; empty is the private main).
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out the candidate commit, attempt 1 (generated)
        id: nikatru-pin-checkout-1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.bridge.merge_state == 'ready' && github.event.client_payload.bridge.merge_sha) || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || inputs.private_ref || 'main') }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Test the candidate commit, attempt 1 (generated)
        id: nikatru-pin-test-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_CHECKOUT: ${{ steps.nikatru-pin-checkout-1.outcome }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
