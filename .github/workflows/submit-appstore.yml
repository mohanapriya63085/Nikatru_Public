      - name: Read the version strings the upload will declare, off the built bundles
        id: versions
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          BUILD_NUMBER: ${{ steps.buildno.outputs.build_number }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
