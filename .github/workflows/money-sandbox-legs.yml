          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          if [ "$MONEY" != "true" ]; then
            echo "money=${MONEY}: this push touches no money path; nothing was to be proven."
            exit 0
          fi
          missing=""
          [ "$WEB" = "true" ] || missing="$missing web"
          [ "$LINUX" = "true" ] || missing="$missing linux"
          [ "$WINDOWS" = "true" ] || missing="$missing windows"
          if [ -n "$missing" ]; then
            echo "::error title=Money proof did not run::the plan says money, and these proof jobs never walked their legs:${missing}. Green here would mean nothing was proven."
