            uid="$(sed -n 's/^user_id=//p' "$out")"
            # why: ALWAYS after the spec, a user or not: the consent rows belong to the browser profiles, not to the user.
            E2E_USER_ID="$uid" E2E_APP_ID=subscriptiontracker E2E_MONEY_CONSENT_LOG="$consent_log" PLATFORM_D1_DATABASE_ID="$(node tooling/e2e/money/preflight.mjs --print-sandbox-platform-db)" \
              node tooling/e2e/purge.mjs || status=1
          done
          # why: the verdict job reads this: a proof that never reached this line proved nothing.
          echo "walked=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Close the sandbox paywall again
        if: ${{ (always()) && needs.plan.outputs.money == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/e2e/money/sandbox-paywall.mjs --close --by "$GITHUB_RUN_ID"
      - name: Every leg's verdict into the job summary (no ids)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = path.join(process.env.RUNNER_TEMP, "money-evidence");
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith(".json")) : [];
            const out = ["| rail | leg | verdict |", "|---|---|---|"];
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              for (const l of r.legs ?? []) out.push(`| ${r.rail} | ${l.id} | ${l.verdict} |`);
            }
            if (files.length === 0) out.push("| - | no evidence record was written | - |");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

