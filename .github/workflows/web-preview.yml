  preview-site:
    name: Preview ${{ matrix.unit }} on its pr-<n> alias
    needs: [nikatru-pin, plan, gate]
    if: (github.event_name != 'repository_dispatch' || github.event.client_payload.event == 'pull_request') && (needs.plan.outputs.site_count != '0' && vars.WEB_PREVIEWS == 'on')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: main
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse anything but a pull request
        run: node tooling/ci/assert-deploy-ref.mjs --allow preview
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          path: .nikatru-pr-tree
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
      - name: Stage the static bytes the preview serves
        id: stage
        env:
          UNIT: ${{ matrix.unit }}
        run: node tooling/ci/web-preview.mjs --stage "$UNIT" --from .nikatru-pr-tree --out build/web-preview/site >> "$GITHUB_OUTPUT"
      - name: Read the project's production branch, and refuse to upload onto it
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNIT: ${{ matrix.unit }}
        run: node tooling/ci/web-preview.mjs --target "$UNIT" >> "$GITHUB_OUTPUT"
      - name: Upload the staged bytes to the pr-<n> alias, never to production
        if: steps.target.outputs.go == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          PR_NUMBER: ${{ github.event.client_payload.pr }}
          HEAD_SHA: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.sha || '') }}
          PROJECT: ${{ steps.target.outputs.project }}
          BRANCH: ${{ steps.target.outputs.branch }}
          PRODUCTION_BRANCH: ${{ steps.target.outputs.production_branch }}
        run: |
          set -uo pipefail
          if [ "$BRANCH" != "pr-${PR_NUMBER}" ] || [ "$BRANCH" = "$PRODUCTION_BRANCH" ]; then
            echo "::error title=web preview::refusing branch '${BRANCH}' (PR ${PR_NUMBER}, production branch '${PRODUCTION_BRANCH}'): only pr-<n>, never production."
            exit 1
          fi
          site="$(pwd)/build/web-preview/site"
          log="$RUNNER_TEMP/wrangler-preview.log"
          node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/wrangler > "$log" 2>&1 || { echo "::error title=web preview::the tooling/wrangler island did not install from its lockfile"; tail -n 20 "$log"; exit 1; }
          got="$(node -p "require('./tooling/wrangler/node_modules/wrangler/package.json').version")"
          if [ "$got" != "$wranglerVersion" ]; then echo "::error title=web preview::the island installed wrangler ${got}, not the ${wranglerVersion} this file pins"; exit 1; fi
          node tooling/ci/pages-deploy.mjs deploy --cwd "$RUNNER_TEMP/wrangler-cwd" --dir "$site" --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$HEAD_SHA" --commit-dirty --expect-environment preview --log "$log"
          code=$?
          if [ "$code" -ne 0 ]; then echo "::error title=web preview::the preview deploy exited ${code}"; exit 1; fi
          echo "uploaded to the ${BRANCH} alias of ${PROJECT}"
      - name: Smoke the preview — the smoke production runs, on the pr-<n> alias
        if: steps.target.outputs.go == 'true'
        env:
          UNIT: ${{ matrix.unit }}
          ALIAS_URL: ${{ steps.target.outputs.alias_url }}
          HEAD_SHA: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.sha || '') }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node tooling/ci/pages-deploy.mjs smoke --site "$UNIT" --origin "$ALIAS_URL" --expect-sha "$HEAD_SHA" --deployment-url "$DEPLOYMENT_URL" --preview
      - name: Record the preview URL
        if: steps.target.outputs.go == 'true'
        env:
          UNIT: ${{ matrix.unit }}
          ALIAS_URL: ${{ steps.target.outputs.alias_url }}
          URL_PATH: ${{ steps.stage.outputs.path }}
        run: node tooling/ci/web-preview.mjs --record
      - name: Store web-preview-${{ matrix.unit }} in the bridge's private home (generated)
        if: steps.target.outputs.go == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: build/web-preview/record/
          NIKATRU_ARTIFACT_NAME: web-preview-${{ matrix.unit }}
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

