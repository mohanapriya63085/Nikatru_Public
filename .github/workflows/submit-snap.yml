          set -euo pipefail
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          node tooling/ops/upload-native-symbols.mjs \
            --cli "${RUNNER_TEMP}/glitchtip-cli" \
            --dir "apps/${APP}/build/symbols/linux" \
            --org "$gt_org" --project "$gt_project"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Generate the snapcraft recipe
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/release/generate-snapcraft.mjs --app "$APP" --bundle "apps/${APP}/build/linux/x64/release/bundle" --out "$RUNNER_TEMP/snapcraft-${APP}" --version ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The generated recipe is complete, still derived, and packable here
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-snapcraft-generable.mjs --emitted "$RUNNER_TEMP/snapcraft-${APP}/snap/snapcraft.yaml" --app "$APP" --pack-runner ubuntu-24.04
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install snapcraft (the track tooling/versions.json pins)
        id: snapcraft
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          track="$(node -p "require('./tooling/versions.json').snapcraft_track")"
          echo "snapcraft track ${track} (tooling/versions.json snapcraft_track)"
          sudo snap install snapcraft --classic --channel "$track"
          # why (review B5-store-channels m6, 2026-10-08; independent review of PR #178 finding 4, 2026-10-09): the
          # track lets point releases move, and an EXACT version pin broke both jobs on every upstream point release
          # until a commit moved it (a revision pin cannot replace it: `snap install --revision` needs developer
          # access to the snap). So snapcraft_version is a FLOOR (the track serving below it is a rollback, refused),
          # and the ONE-snapcraft property is held where it matters: the submit job refuses a revision other than
          # the one this dry run packed and rehearsed with, which it receives as this job's output.
          want="$(node -p "require('./tooling/versions.json').snapcraft_version")"
          got="$(snapcraft --version | sed -n 's/^snapcraft[[:space:]]*//p' | sed -n 1p)"
          rev="$(snap list snapcraft | awk 'NR==2 {print $3}')"
          echo "snapcraft ${got} (revision ${rev}) installed from ${track}; floor ${want} (tooling/versions.json snapcraft_version)"
          [ -n "$got" ] && [ -n "$rev" ] || { echo "::error title=snapcraft pin::could not read the installed snapcraft version (${got:-none}) or revision (${rev:-none})."; exit 1; }
          [ "$(printf '%s\n%s\n' "$want" "$got" | sort -V | sed -n 1p)" = "$want" ] || { echo "::error title=snapcraft pin::the ${track} track served snapcraft ${got}, BELOW the floor ${want} in tooling/versions.json: a rollback on the track, not a release to pack with."; exit 1; }
          echo "version=${got}" >> "$GITHUB_OUTPUT"
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Pack the snap
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          project="${RUNNER_TEMP}/snapcraft-${APP}"
          collected="${GITHUB_WORKSPACE}/apps/${APP}/build/linux/snap/${APP}.snap"
          cd "$project"
          sudo snapcraft pack --destructive-mode
          count="$(find "$project" -maxdepth 1 -type f -name '*.snap' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "FAIL snapcraft exited 0 and left ${count} .snap file(s) in ${project}:" >&2
            find "$project" -maxdepth 1 -type f -name '*.snap' >&2
            echo "     Exactly one is required. Zero is a pack that produced nothing while reporting" >&2
            echo "     success; more than one means this step would have to choose which snap the" >&2
            echo "     channel submits, and a chooser with no stated rule picks silently." >&2
            exit 1
          fi
          built="$(find "$project" -maxdepth 1 -type f -name '*.snap')"
          mkdir -p "$(dirname "$collected")"
          sudo mv "$built" "$collected"
          sudo chown "$(id -u):$(id -g)" "$collected"
          ls -l "$collected"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The packed snap loads only libraries it carries (ldd on the primed binary)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          prime="${RUNNER_TEMP}/snapcraft-${APP}/prime"
          snaps="$(node tooling/ci/assert-snap-primed-libs.mjs --prime "$prime" --emit-snaps)"
          for s in $snaps; do sudo snap install "$s"; done
          node tooling/ci/assert-snap-primed-libs.mjs --prime "$prime"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Restore the ${{ needs.build-arm64.outputs.artifact }} hand-off (generated)
        id: nikatru-restore-3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-${{ needs.build-arm64.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-${{ needs.build-arm64.outputs.artifact }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the ${{ needs.build-arm64.outputs.artifact }} hand-off (generated)
        id: nikatru-unseal-3
        if: ${{ (success()) && steps.nikatru-restore-3.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-3.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-${{ needs.build-arm64.outputs.artifact }}-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the ${{ needs.build-arm64.outputs.artifact }} hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-3.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/linux/snap
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: The arm64 snap is the one the arm64 job hashed (sha256)
        env:
          EXPECTED_SHA256: ${{ needs.build-arm64.outputs.sha256 }}
          SNAP_ARM64: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}-arm64.snap
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          if ! grep -Eqx '[0-9a-f]{64}' <<<"$EXPECTED_SHA256"; then
            echo "FAIL the arm64 job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$SNAP_ARM64" | sha256sum --check --strict -
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Dry-run the Snap Store submission
        env:
          SNAPCRAFT_STORE_CREDENTIALS_EXPIRES: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS_EXPIRES }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/release/submit-snap.mjs --dry-run --app "$APP"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Name clearance holds for linux-snap (owner HELD or PROVEN-FREE)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-name-clearance.mjs --for-submission=linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.19 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every supported language is translated by the pipeline (linux-snap, dry run)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-translations-generated.mjs --for-submission=linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.20 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The Snap Store screenshot set covers its declared device types
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-play-device-coverage.mjs --for-submission=linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.21 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: A build that cannot sign in reaches no public risk (linux-snap)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-channel-register.mjs --for-submission=linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.22 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every target this channel ships to has its golden-path legs graded (linux-snap)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-e2e-legs.mjs --for-submission=linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.23 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand the submit job this snap's name and sha256
        id: bytes
        env:
          SNAP: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}.snap
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          sum="$(sha256sum "$SNAP" | cut -d ' ' -f 1)"
          echo "artifact=${APP}-linux-snap" >> "$GITHUB_OUTPUT"
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "${sum}  ${SNAP}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.24 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage ${{ steps.bytes.outputs.artifact }} for this run's later jobs (generated)
        id: nikatru-stage-4
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}.snap
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Seal ${{ steps.bytes.outputs.artifact }} for the public cache (generated)
        id: nikatru-seal-4
        if: ${{ (success()) && steps.nikatru-stage-4.outputs.has == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_KEY: nikatru-handoff-${{ steps.bytes.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tooling/ci/shell-handoff.mjs seal
      - name: Hand off ${{ steps.bytes.outputs.artifact }} to this run's later jobs (generated)
        if: ${{ (success()) && steps.nikatru-seal-4.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-${{ steps.bytes.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Record the dry run in the [10]D-9 ledger (mode dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/record-deployment.mjs "${APP}-linux-snap" --mode dry-run
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.dry-run.26 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-submit-snap.dry-run.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  promote:
    name: Promote latest/candidate to latest/stable (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [nikatru-pin, gate]
    if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.promote_confirm == 'PROMOTE-SNAP-TO-STABLE' && inputs.confirm != 'SUBMIT-TO-SNAP-STORE'
    environment: store-publish
    permissions:
      contents: read
      deployments: write
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: Preflight — the Snap Store credential must be present
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error title=Snap Store promotion cannot run::SNAPCRAFT_STORE_CREDENTIALS is empty in this store-publish job. OWNER STEP: GitHub -> Settings -> Environments -> store-publish -> Environment secrets -> add SNAPCRAFT_STORE_CREDENTIALS (Private/runbooks/store-submission-snap.md). This is a FAILED promotion, not a skipped one."
            exit 1
          fi
          echo "SNAPCRAFT_STORE_CREDENTIALS present — the promotion may proceed."
      - name: A promotion must name the listing it will be recorded against
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the promotion will be recorded against ${LISTING_URL}"
              ;;
            *)
              echo "FAIL the \`listing_url\` dispatch input is '${LISTING_URL}', not an https URL, and this job is a REAL promotion." >&2
              echo "     Re-dispatch with listing_url set, e.g.  https://snapcraft.io/<snap-name>" >&2
              exit 1
              ;;
          esac
      - name: Name clearance holds for linux-snap (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=linux-snap
      - name: A build that cannot sign in reaches no public risk (linux-snap)
        run: node tooling/ci/assert-channel-register.mjs --for-submission=linux-snap --real-submission
      - name: Install snapcraft for the promotion (the pinned track, held to its floor)
        run: |
          set -euo pipefail
          track="$(node -p "require('./tooling/versions.json').snapcraft_track")"
          sudo snap install snapcraft --classic --channel "$track"
          want="$(node -p "require('./tooling/versions.json').snapcraft_version")"
          got="$(snapcraft --version | sed -n 's/^snapcraft[[:space:]]*//p' | sed -n 1p)"
          echo "snapcraft ${got} installed from ${track}; floor ${want} (tooling/versions.json snapcraft_version)"
          [ -n "$got" ] || { echo "::error title=snapcraft pin::could not read the installed snapcraft version."; exit 1; }
          [ "$(printf '%s\n%s\n' "$want" "$got" | sort -V | sed -n 1p)" = "$want" ] || { echo "::error title=snapcraft pin::the ${track} track served snapcraft ${got}, BELOW the floor ${want} in tooling/versions.json."; exit 1; }
      - name: Promote latest/candidate to latest/stable
        id: promote
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROMOTE_CONFIRM: ${{ inputs.promote_confirm }}
        run: >
          node tooling/release/submit-snap.mjs --promote --execute --app "$APP"
          --confirm "$PROMOTE_CONFIRM"
      - name: Record the promotion in the [10]D-9 ledger
        if: always() && steps.promote.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
        run: node tooling/ci/record-deployment.mjs "${APP}-linux-snap" --state released --listing-url "$LISTING_URL" --mode production

  build-arm64:
    name: Build and pack the arm64 snap (${{ needs.gate.outputs.app }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: [nikatru-pin, gate]
    outputs:
      artifact: ${{ steps.bytes.outputs.artifact }}
      sha256: ${{ steps.bytes.outputs.sha256 }}
      snapcraft_version: ${{ steps.snapcraft.outputs.version }}
    env:
      APP: ${{ needs.gate.outputs.app }}
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        with:
          cache: 'false'
      - name: Linux build deps (the same list the Linux build lane installs)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          deps="$(node tooling/release/generate-snapcraft.mjs --emit-build-deps)"
          echo "installing (arm64): ${deps}"
          sudo apt-get update
          sudo apt-get install -y ${deps}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Resolve the workspace
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Derive the release line from pubspec
        id: ver
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build linux (arm64)
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs "$APP" linux linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run for this run's later jobs (generated)
        id: nikatru-stage-5
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: apps/${{ needs.gate.outputs.app }}/build/symbols/linux
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Seal symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run for the public cache (generated)
        id: nikatru-seal-5
        if: ${{ (success()) && steps.nikatru-stage-5.outputs.has == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_KEY: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tooling/ci/shell-handoff.mjs seal
      - name: Hand off symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run to this run's later jobs (generated)
        if: ${{ (success()) && steps.nikatru-seal-5.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Generate the snapcraft recipe (arm64 bundle)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/release/generate-snapcraft.mjs --app "$APP" --bundle "apps/${APP}/build/linux/arm64/release/bundle" --out "$RUNNER_TEMP/snapcraft-${APP}" --version ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The generated recipe is complete, still derived, and packable here
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-snapcraft-generable.mjs --emitted "$RUNNER_TEMP/snapcraft-${APP}/snap/snapcraft.yaml" --app "$APP" --pack-runner ubuntu-24.04-arm
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install snapcraft (the track tooling/versions.json pins)
        id: snapcraft
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          track="$(node -p "require('./tooling/versions.json').snapcraft_track")"
          echo "snapcraft track ${track} (tooling/versions.json snapcraft_track)"
          sudo snap install snapcraft --classic --channel "$track"
          want="$(node -p "require('./tooling/versions.json').snapcraft_version")"
          got="$(snapcraft --version | sed -n 's/^snapcraft[[:space:]]*//p' | sed -n 1p)"
          echo "snapcraft ${got} installed from ${track}; floor ${want} (tooling/versions.json snapcraft_version)"
          [ -n "$got" ] || { echo "::error title=snapcraft pin::could not read the installed snapcraft version."; exit 1; }
          [ "$(printf '%s\n%s\n' "$want" "$got" | sort -V | sed -n 1p)" = "$want" ] || { echo "::error title=snapcraft pin::the ${track} track served snapcraft ${got}, BELOW the floor ${want} in tooling/versions.json: a rollback on the track, not a release to pack with."; exit 1; }
          echo "version=${got}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Pack the snap (arm64)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          project="${RUNNER_TEMP}/snapcraft-${APP}"
          collected="${GITHUB_WORKSPACE}/apps/${APP}/build/linux/snap/${APP}-arm64.snap"
          cd "$project"
          sudo snapcraft pack --destructive-mode
          count="$(find "$project" -maxdepth 1 -type f -name '*.snap' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "FAIL snapcraft exited 0 and left ${count} .snap file(s) in ${project}:" >&2
            find "$project" -maxdepth 1 -type f -name '*.snap' >&2
            echo "     Exactly one is required: zero is a pack that produced nothing while reporting success," >&2
            echo "     and more than one means this step would have to choose which snap the channel submits." >&2
            exit 1
          fi
          built="$(find "$project" -maxdepth 1 -type f -name '*.snap')"
          case "$built" in
            *_arm64.snap) ;;
            *) echo "FAIL the arm64 pack produced ${built}, not an _arm64.snap: the recipe built for another architecture." >&2; exit 1 ;;
          esac
          mkdir -p "$(dirname "$collected")"
          sudo mv "$built" "$collected"
          sudo chown "$(id -u):$(id -g)" "$collected"
          ls -l "$collected"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The packed snap loads only libraries it carries (ldd on the primed binary)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          prime="${RUNNER_TEMP}/snapcraft-${APP}/prime"
          snaps="$(node tooling/ci/assert-snap-primed-libs.mjs --prime "$prime" --emit-snaps)"
          for s in $snaps; do sudo snap install "$s"; done
          node tooling/ci/assert-snap-primed-libs.mjs --prime "$prime"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand on this snap's name and sha256
        id: bytes
        env:
          SNAP: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}-arm64.snap
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          sum="$(sha256sum "$SNAP" | cut -d ' ' -f 1)"
          echo "artifact=${APP}-linux-snap-arm64" >> "$GITHUB_OUTPUT"
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "${sum}  ${SNAP}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name submit-snap.build-arm64.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage ${{ steps.bytes.outputs.artifact }} for this run's later jobs (generated)
        id: nikatru-stage-6
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}-arm64.snap
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Seal ${{ steps.bytes.outputs.artifact }} for the public cache (generated)
        id: nikatru-seal-6
        if: ${{ (success()) && steps.nikatru-stage-6.outputs.has == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_KEY: nikatru-handoff-${{ steps.bytes.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tooling/ci/shell-handoff.mjs seal
      - name: Hand off ${{ steps.bytes.outputs.artifact }} to this run's later jobs (generated)
        if: ${{ (success()) && steps.nikatru-seal-6.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-${{ steps.bytes.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-submit-snap.build-arm64.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  submit:
    name: Upload to the Snap Store (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [nikatru-pin, gate, dry-run, build-arm64]
    if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.confirm == 'SUBMIT-TO-SNAP-STORE'
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: Preflight — the Snap Store credential must be present
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error title=Snap Store upload cannot run::SNAPCRAFT_STORE_CREDENTIALS is empty in this store-publish job. It is a store-publish ENVIRONMENT secret (tooling/channel-register.json scopes it there). OWNER STEP: GitHub -> Settings -> Environments -> store-publish -> Environment secrets -> add SNAPCRAFT_STORE_CREDENTIALS (the snapcraft export-login blob; Private/runbooks/store-submission-snap.md). This is a FAILED upload, not a skipped one."
            exit 1
          fi
          echo "SNAPCRAFT_STORE_CREDENTIALS present — the upload may proceed."
      - name: A real submission must name the listing it will be recorded against
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL upload." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could upload and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g.  https://snapcraft.io/<snap-name>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     dashboard is behind an account nobody can open. A value that does not resolve is a" >&2
              echo "     second source of truth, not a record." >&2
              exit 1
              ;;
          esac
      - name: Name clearance holds for linux-snap (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=linux-snap
      - name: Every supported language is translated by the pipeline (linux-snap, real submission)
        run: node tooling/ci/assert-translations-generated.mjs --for-submission=linux-snap --real-submission
      - name: The Snap Store screenshot set covers its declared device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=linux-snap
      - name: A build that cannot sign in reaches no public risk (linux-snap)
        run: node tooling/ci/assert-channel-register.mjs --for-submission=linux-snap --real-submission
      - name: Every target this channel ships to has its golden-path legs graded (linux-snap)
        run: node tooling/ci/assert-e2e-legs.mjs --for-submission=linux-snap
      - name: Restore the ${{ needs.dry-run.outputs.artifact }} hand-off (generated)
        id: nikatru-restore-7
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the ${{ needs.dry-run.outputs.artifact }} hand-off (generated)
        id: nikatru-unseal-7
        if: ${{ (success()) && steps.nikatru-restore-7.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-7.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the ${{ needs.dry-run.outputs.artifact }} hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-7.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/linux/snap
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: The snap is the one the dry-run job hashed (sha256)
        env:
          EXPECTED_SHA256: ${{ needs.dry-run.outputs.sha256 }}
          SNAP: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}.snap
        run: |
          set -euo pipefail
          if ! grep -Eqx '[0-9a-f]{64}' <<<"$EXPECTED_SHA256"; then
            echo "FAIL the dry-run job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$SNAP" | sha256sum --check --strict -
      - name: Restore the ${{ needs.build-arm64.outputs.artifact }} hand-off (generated)
        id: nikatru-restore-8
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-${{ needs.build-arm64.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-${{ needs.build-arm64.outputs.artifact }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the ${{ needs.build-arm64.outputs.artifact }} hand-off (generated)
        id: nikatru-unseal-8
        if: ${{ (success()) && steps.nikatru-restore-8.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-8.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-${{ needs.build-arm64.outputs.artifact }}-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the ${{ needs.build-arm64.outputs.artifact }} hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-8.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/linux/snap
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: The arm64 snap is the one the arm64 job hashed (sha256)
        env:
          EXPECTED_SHA256: ${{ needs.build-arm64.outputs.sha256 }}
          DRY_RUN_SNAPCRAFT_VERSION: ${{ needs.dry-run.outputs.snapcraft_version }}
          ARM64_SNAPCRAFT_VERSION: ${{ needs.build-arm64.outputs.snapcraft_version }}
          SNAP_ARM64: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}-arm64.snap
        run: |
          set -euo pipefail
          if ! grep -Eqx '[0-9a-f]{64}' <<<"$EXPECTED_SHA256"; then
            echo "FAIL the arm64 job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          # why: compared, not `sha256sum --check`: the dry-run-bytes guard grades ONE check line per submit job
          # (the amd64 one above), and a second line of that spelling would let it pass with the amd64 check gone.
          got="$(sha256sum "$SNAP_ARM64" | cut -d ' ' -f 1)"
          [ "$got" = "$EXPECTED_SHA256" ] || { echo "FAIL ${SNAP_ARM64} hashes to ${got}, and the arm64 job packed ${EXPECTED_SHA256}: these are not its bytes." >&2; exit 1; }
          echo "${got}  ${SNAP_ARM64}: OK"
          # A revision number is per architecture, so the two packs are held to one snapcraft VERSION.
          [ -n "$ARM64_SNAPCRAFT_VERSION" ] && [ "$ARM64_SNAPCRAFT_VERSION" = "$DRY_RUN_SNAPCRAFT_VERSION" ] || { echo "::error title=snapcraft pin::the arm64 snap was packed with snapcraft ${ARM64_SNAPCRAFT_VERSION:-unknown} and the amd64 one with ${DRY_RUN_SNAPCRAFT_VERSION:-unknown}; dispatch again so both run one snapcraft."; exit 1; }
      - name: Restore the symbols-${{ needs.gate.outputs.app }}-linux-snap-dry-run hand-off (generated)
        id: nikatru-restore-9
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-dry-run-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the symbols-${{ needs.gate.outputs.app }}-linux-snap-dry-run hand-off (generated)
        id: nikatru-unseal-9
        if: ${{ (success()) && steps.nikatru-restore-9.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-9.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-dry-run-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the symbols-${{ needs.gate.outputs.app }}-linux-snap-dry-run hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-9.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/symbols/linux
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: Restore the symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run hand-off (generated)
        id: nikatru-restore-10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run hand-off (generated)
        id: nikatru-unseal-10
        if: ${{ (success()) && steps.nikatru-restore-10.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-10.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the symbols-${{ needs.gate.outputs.app }}-linux-snap-arm64-dry-run hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-10.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/symbols/linux
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: Install snapcraft (the track tooling/versions.json pins)
        env:
          DRY_RUN_SNAPCRAFT_VERSION: ${{ needs.dry-run.outputs.snapcraft_version }}
          DRY_RUN_SNAPCRAFT_REVISION: ${{ needs.dry-run.outputs.snapcraft_revision }}
        run: |
          set -euo pipefail
          track="$(node -p "require('./tooling/versions.json').snapcraft_track")"
          echo "snapcraft track ${track} (tooling/versions.json snapcraft_track)"
          sudo snap install snapcraft --classic --channel "$track"
          # why (review B5-store-channels m6, 2026-10-08; independent review of PR #178 finding 4, 2026-10-09): the
          # track lets point releases move, and an EXACT version pin broke both jobs on every upstream point release
          # until a commit moved it (a revision pin cannot replace it: `snap install --revision` needs developer
          # access to the snap). So snapcraft_version is a FLOOR (the track serving below it is a rollback, refused),
          # and the ONE-snapcraft property is held where it matters: the submit job refuses a revision other than
          # the one this dry run packed and rehearsed with, which it receives as this job's output.
          want="$(node -p "require('./tooling/versions.json').snapcraft_version")"
          got="$(snapcraft --version | sed -n 's/^snapcraft[[:space:]]*//p' | sed -n 1p)"
          rev="$(snap list snapcraft | awk 'NR==2 {print $3}')"
          echo "snapcraft ${got} (revision ${rev}) installed from ${track}; floor ${want} (tooling/versions.json snapcraft_version)"
          [ -n "$got" ] && [ -n "$rev" ] || { echo "::error title=snapcraft pin::could not read the installed snapcraft version (${got:-none}) or revision (${rev:-none})."; exit 1; }
          [ "$(printf '%s\n%s\n' "$want" "$got" | sort -V | sed -n 1p)" = "$want" ] || { echo "::error title=snapcraft pin::the ${track} track served snapcraft ${got}, BELOW the floor ${want} in tooling/versions.json: a rollback on the track, not a release to pack with."; exit 1; }
          # The upload runs the snapcraft the dry run rehearsed, or nothing: a point release that landed between the two
          # jobs is refused here, and a re-dispatch converges (its dry run and submit then install the same revision).
          [ "$rev" = "$DRY_RUN_SNAPCRAFT_REVISION" ] || { echo "::error title=snapcraft pin::the submit job installed snapcraft ${got} (revision ${rev}), and the dry run packed and rehearsed with ${DRY_RUN_SNAPCRAFT_VERSION:-unknown} (revision ${DRY_RUN_SNAPCRAFT_REVISION:-unknown}). The ${track} track moved between the two jobs; dispatch again so both run one snapcraft."; exit 1; }
      - name: Copy this build's symbols to the release store (R2), before the upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_LINE: ${{ needs.dry-run.outputs.release_line }}
        run: |
          set -euo pipefail
          release_line="${RELEASE_LINE}"
          node tooling/ci/r2-durable-copy.mjs --kind symbols --app "$APP" --channel linux-snap \
            --version "${release_line}.${RUN_NUMBER}" --build "$RUN_NUMBER" \
            --dir "apps/${APP}/build/symbols/linux" --out "${RUNNER_TEMP}/symbols-record.json"
      - name: The linux-snap artifact is within its store's size limit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SNAP: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}.snap
          SNAP_ARM64: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}-arm64.snap
        run: |
          set -euo pipefail
          node tooling/ci/assert-artifact-size.mjs --app "$APP" --channel linux-snap "$SNAP"
          node tooling/ci/assert-artifact-size.mjs --app "$APP" --channel linux-snap "$SNAP_ARM64"
      - name: Upload to the Snap Store
        id: upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAPCRAFT_STORE_CREDENTIALS_EXPIRES: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS_EXPIRES }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
        run: >
          node tooling/release/submit-snap.mjs --submit --app "$APP"
          --confirm "$CONFIRM"
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
          RUN_NUMBER: ${{ github.run_number }}
          SNAP: apps/${{ needs.gate.outputs.app }}/build/linux/snap/${{ needs.gate.outputs.app }}.snap
        run: node tooling/ci/record-deployment.mjs "${APP}-linux-snap" --state released --listing-url "$LISTING_URL" --mode production --artifact "$SNAP" --build-number "$RUN_NUMBER" --symbols-record "${RUNNER_TEMP}/symbols-record.json"

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [gate, dry-run, promote, build-arm64, submit]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: gate=${{ needs.gate.result }} dry-run=${{ needs.dry-run.result }} promote=${{ needs.promote.result }} build-arm64=${{ needs.build-arm64.result }} submit=${{ needs.submit.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
