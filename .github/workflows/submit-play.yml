          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: node tooling/ci/assert-artifact-size.mjs --app "$APP" --channel android-play "$AAB"
      - name: The store service account is still powerless on GCP
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node tooling/ops/verify-free-api-scope.mjs
      - name: Upload to Google Play
        id: upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track || 'internal' }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          ROLLOUT_FRACTION: ${{ inputs.rollout_fraction }}
          ROLLOUT_CONFIRM: ${{ inputs.rollout_confirm }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node tooling/release/submit-play.mjs --submit --app "$APP"
          --confirm "$CONFIRM" --status "$RELEASE_STATUS"
          --rollout-fraction "$ROLLOUT_FRACTION" --rollout-confirm "$ROLLOUT_CONFIRM"
      - name: The Play track must carry the bundle this job just uploaded
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.dry-run.outputs.version_code }}
        run: |
          set -euo pipefail
          case "${VERSION_CODE}" in
            ''|*[!0-9]*)
              echo "FAIL the dry-run job's version_code is '${VERSION_CODE}', not a positive integer; the versionCode" >&2
              echo "     this job uploaded cannot be known, so the probe refuses to guess." >&2
              exit 1
              ;;
          esac
          APPLICATION_ID="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { readGradleApplicationId } from "./tooling/ci/read-identity.mjs";
          const rel = "apps/" + process.env.APP + "/android/app/build.gradle.kts";
          const id = readGradleApplicationId(readFileSync(rel, "utf8"), rel);
          if (!id.value) { console.error(id.missing ?? id.lost); process.exit(1); }
          process.stdout.write(id.value);
          ')"
          echo "⬜ [14]O-7 reading the Play track state for ${APPLICATION_ID}, expecting versionCode ${VERSION_CODE}"
          node tooling/ops/post-deploy-smoke.mjs --play-package "${APPLICATION_ID}" --expect "${VERSION_CODE}"
          echo "::notice title=Play versionCode high-water::versionCode ${VERSION_CODE} is consumed, and the ledger now holds it: the next dispatch stops until the mark is raised. One command moves the mark AND the release-notes header together (review B5-store-channels m7) - node tooling/release/advance-play-mark.mjs --app ${APP} --consumed ${VERSION_CODE} --run ${GITHUB_RUN_ID} --notes <next release notes file> (or --keep-notes for a hotfix), then commit both files"
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
          VERSION_CODE: ${{ needs.dry-run.outputs.version_code }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          PLAY_TRACK: ${{ inputs.track || 'internal' }}
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          if [ "$RELEASE_STATUS" = draft ]; then
            node tooling/ci/record-deployment.mjs "${APP}-android-play" --state draft_staged --listing-url "$LISTING_URL" --version-code "$VERSION_CODE" --mode production --artifact "$AAB" --build-number "$VERSION_CODE" --symbols-record "${RUNNER_TEMP}/symbols-record.json"
          elif [ "$PLAY_TRACK" = internal ] || [ "$PLAY_TRACK" = qa ]; then
            node tooling/ci/record-deployment.mjs "${APP}-android-play" --state testing_live --listing-url "$LISTING_URL" --version-code "$VERSION_CODE" --mode production --artifact "$AAB" --build-number "$VERSION_CODE" --symbols-record "${RUNNER_TEMP}/symbols-record.json"
          else
            node tooling/ci/record-deployment.mjs "${APP}-android-play" --state in_review --listing-url "$LISTING_URL" --version-code "$VERSION_CODE" --mode production --artifact "$AAB" --build-number "$VERSION_CODE" --symbols-record "${RUNNER_TEMP}/symbols-record.json"
          fi

  promote:
    name: Move the production staged rollout (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [nikatru-pin, gate]
    if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.promote != 'none' && inputs.confirm == 'PROMOTE-ON-PLAY'
    concurrency:
      group: store-cadence
      cancel-in-progress: false
    environment: store-publish
    permissions:
      contents: read
      deployments: write
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: A rollout move must name the listing it will be recorded against
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*) echo "⬜ [10]D-9 the rollout move will be recorded against ${LISTING_URL}" ;;
            *) echo "FAIL listing_url is '${LISTING_URL}', not an https URL; the [10]D-9 record of this move would have no listing." >&2; exit 1 ;;
          esac
      - name: The store service account is still powerless on GCP
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node tooling/ops/verify-free-api-scope.mjs
      - name: Move the production staged rollout
        id: promote
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PROMOTE: ${{ inputs.promote }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PROMOTE" = halt ]; then
            node tooling/release/submit-play.mjs --promote --app "$APP" --halt --confirm "$CONFIRM"
          elif [ "$PROMOTE" = resume ]; then
            node tooling/release/submit-play.mjs --promote --app "$APP" --resume --confirm "$CONFIRM"
          else
            node tooling/release/submit-play.mjs --promote --app "$APP" --to "$PROMOTE" --confirm "$CONFIRM"
          fi
      - name: The Play track must still carry the release this job moved
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.promote.outputs.version_code }}
        run: |
          set -euo pipefail
          case "${VERSION_CODE}" in
            ''|*[!0-9]*)
              echo "FAIL the move step's version_code is '${VERSION_CODE}', not a positive integer; the release" >&2
              echo "     this job moved cannot be known, so the probe refuses to guess." >&2
              exit 1
              ;;
          esac
          APPLICATION_ID="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { readGradleApplicationId } from "./tooling/ci/read-identity.mjs";
          const rel = "apps/" + process.env.APP + "/android/app/build.gradle.kts";
          const id = readGradleApplicationId(readFileSync(rel, "utf8"), rel);
          if (!id.value) { console.error(id.missing ?? id.lost); process.exit(1); }
          process.stdout.write(id.value);
          ')"
          echo "⬜ [14]O-7 reading the Play track state for ${APPLICATION_ID}, expecting versionCode ${VERSION_CODE}"
          node tooling/ops/post-deploy-smoke.mjs --play-package "${APPLICATION_ID}" --expect "${VERSION_CODE}"
      - name: Record the rollout move in the [10]D-9 ledger
        if: always() && steps.promote.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
          VERSION_CODE: ${{ steps.promote.outputs.version_code }}
        run: node tooling/ci/record-deployment.mjs "${APP}-android-play" --state rollout_moved --listing-url "$LISTING_URL" --version-code "$VERSION_CODE" --mode production

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [gate, dry-run, submit, promote]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: gate=${{ needs.gate.result }} dry-run=${{ needs.dry-run.result }} submit=${{ needs.submit.result }} promote=${{ needs.promote.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
