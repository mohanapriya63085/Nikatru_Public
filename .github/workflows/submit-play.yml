env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: "Store submit: Google Play"

run-name: "Store submit: Google Play · ${{ inputs.app }} · ${{ inputs.confirm }}${{ inputs.track && format(' · track {0}', inputs.track) || '' }}${{ inputs.release_status && format(' · status {0}', inputs.release_status) || '' }}${{ inputs.rollout_fraction && inputs.release_status == 'inProgress' && format(' · rollout {0}', inputs.rollout_fraction) || '' }}${{ inputs.promote && inputs.promote != 'none' && format(' · promote {0}', inputs.promote) || '' }}${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'The app to submit: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string
      confirm:
        description: 'Type SUBMIT-TO-PLAY to authorise a real upload, or PROMOTE-ON-PLAY to move a production staged rollout (with promote). Anything else runs the dry run only.'
        required: true
        default: 'dry-run-only'
        type: string
      track:
        description: 'Play track. Default internal. If this app''s API names its internal-testing track `qa`, type qa. `production` is REFUSED unless release_status is draft, or inProgress with rollout_confirm (ADR 031 class A).'
        required: false
        default: 'internal'
        type: string
      release_status:
        description: 'Release status on that track: completed (served to the track''s testers), draft (uploaded, not served), or inProgress (a staged PRODUCTION rollout to rollout_fraction of users; needs rollout_confirm).'
        required: false
        default: 'completed'
        type: choice
        options: [completed, draft, inProgress]
      rollout_fraction:
        description: 'The fraction of production users a staged rollout starts at, strictly between 0 and 1. Read only when track is production and release_status is inProgress.'
        required: false
        default: '0.1'
        type: string
      rollout_confirm:
        description: 'Type ROLLOUT-TO-PRODUCTION to authorise a staged production rollout (release_status inProgress). Ignored otherwise.'
        required: false
        default: ''
        type: string
      promote:
        description: 'Move the production staged rollout instead of uploading: 0.5, 1.0 (every user), halt, or resume (a halted rollout, at its own fraction). Needs confirm PROMOTE-ON-PLAY; none does nothing.'
        required: false
        default: 'none'
        type: choice
        options: ['none', '0.5', '1.0', 'halt', 'resume']
      listing_url:
        description: 'The Play listing URL this submission will be recorded against, e.g. https://play.google.com/store/apps/details?id=<applicationId>. Required for a real upload; ignored by the dry run.'
        required: false
        default: ''
        type: string
      worker_slot:
        description: 'Set by the platform Worker cron only: the slot of record it fired for. A worker-slot run is the weekly dry run. Empty on a hand dispatch.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out the candidate commit, attempt 1 (generated)
        id: nikatru-pin-checkout-1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.bridge.merge_state == 'ready' && github.event.client_payload.bridge.merge_sha) || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Test the candidate commit, attempt 1 (generated)
        id: nikatru-pin-test-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_CHECKOUT: ${{ steps.nikatru-pin-checkout-1.outcome }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_ATTEMPT: '1'
          NIKATRU_ATTEMPTS: '1'
          NIKATRU_WAIT_S: '10'
        run: |
          if [ "$NIKATRU_CHECKOUT" != success ]; then
            echo "attempt $NIKATRU_ATTEMPT: the candidate could not be checked out"
          else
            sha="$(git rev-parse HEAD)"
            if [ "$NIKATRU_P_EVENT" = pull_request ]; then
              if ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then echo "::error::the dispatch of a pull request names no 40-hex head sha (\"$NIKATRU_P_SHA\"): nothing is pinned"; exit 1; fi
