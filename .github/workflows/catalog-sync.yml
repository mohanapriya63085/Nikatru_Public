  apply:
    needs: [nikatru-pin]
    name: Create and update every store and payment product from the register (owner-approved)
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main')) && ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.confirm == 'APPLY-CATALOG')
