          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name time-travel.brick-worker.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The stamped Worker suite, on another day
        working-directory: services/probeapi-api
