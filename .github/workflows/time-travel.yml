env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Time travel

on:
  workflow_dispatch:
    inputs:
      instant:
        description: 'Run only this instant (ISO-8601 with a zone, e.g. 2027-11-05T00:00:00Z); empty runs the scheduled three'
        type: string
        default: ''
      private_ref:
        description: The PRIVATE ref this run builds, refs/heads/<branch> (generated; empty is the private main).
        required: false
        default: ''
        type: string
  schedule:
    - cron: '10 5 * * *'

permissions:
  contents: read

concurrency:
  group: time-travel
  cancel-in-progress: false

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
    defaults:
