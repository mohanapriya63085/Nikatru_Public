        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-rollback.rehearse.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [group, rollback, rehearse]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: group=${{ needs.group.result }} rollback=${{ needs.rollback.result }} rehearse=${{ needs.rehearse.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
