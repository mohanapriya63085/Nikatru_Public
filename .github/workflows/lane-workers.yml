      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: "Check out private main's pool tooling, which this job runs instead of the branch's (generated: the private tree)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: main
          path: .pool-trusted
          sparse-checkout: |
            tooling
            .github/workflows
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
        timeout-minutes: 2
      - id: node-pin
        name: Read the Node pin from private main's copy, never from this branch's tree
        timeout-minutes: 1
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          [ -d .pool-trusted ] && [ ! -L .pool-trusted ] && [ "$(cd .pool-trusted && pwd -P)" = "$(pwd -P)/.pool-trusted" ] || { echo "::error::.pool-trusted is not private main's checkout"; exit 1; }
          [ ! -L .pool-trusted/tooling ] && [ ! -L .pool-trusted/tooling/versions.json ] || { echo "::error::private main's versions.json is a symlink"; exit 1; }
          v="$(jq -r '.node' .pool-trusted/tooling/versions.json)"
          [[ "$v" =~ ^[0-9]+$ ]] || { echo "::error::private main's tooling/versions.json names no Node major"; exit 1; }
          echo "node=$v" >> "$GITHUB_OUTPUT"
