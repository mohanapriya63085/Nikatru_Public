          & icacls.exe $env:RUNNER_TEMP | Write-Output
          $domain, $user = $me -split '\\', 2
          Write-Output "The job runs as $me; USERDOMAIN\USERNAME read ${env:USERDOMAIN}\${env:USERNAME}"
          $dirs = @(Get-Command ssh -All -CommandType Application -ErrorAction SilentlyContinue | ForEach-Object { Split-Path $_.Source })
          $git = Get-Command git -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($git) { $dirs += Join-Path (Split-Path (Split-Path $git.Source)) 'usr\bin' }
          $dirs = @($dirs | Where-Object { Test-Path (Join-Path $_ 'ssh-keygen.exe') } | Select-Object -Unique)
          $chosen = $null
          foreach ($dir in $dirs) {
            $probe = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
            $keygen = Join-Path $dir 'ssh-keygen.exe'
            & $keygen -q -t ed25519 -N '' -C nikatru-probe -f "$probe.seed" | Out-Null
            [IO.File]::WriteAllText($probe, (Get-Content -Raw "$probe.seed").Trim() + "`n")
            & icacls.exe $probe /grant:r "${domain}\${user}:F" | Out-Null
            & icacls.exe $probe /inheritance:r | Out-Null
            $said = (& $keygen -y -f $probe 2>&1 | Out-String).Trim()
            $loaded = $LASTEXITCODE -eq 0
            Write-Output "$(Join-Path $dir 'ssh.exe'): $(if ($loaded) { 'loads the key' } else { "refuses the key: $said" })"
            & icacls.exe $probe | Write-Output
            Remove-Item -Force -ErrorAction SilentlyContinue $probe, "$probe.seed", "$probe.seed.pub"
            if ($loaded) { $chosen = $dir; break }
