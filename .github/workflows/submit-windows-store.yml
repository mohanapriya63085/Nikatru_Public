      - name: Confirm the ${{ steps.bytes.outputs.artifact }} hand-off is in the cache as -r3 (generated)
        id: nikatru-saved-6-3
        if: ${{ (success()) && steps.nikatru-seal-6.outcome == 'success' && steps.nikatru-saved-6-1.outputs.cache-hit != 'true' && steps.nikatru-saved-6-2.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-${{ steps.bytes.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}-r3
          lookup-only: true
