          if [ -z "$MS_STORE_SELLER_ID" ];     then missing="$missing MS_STORE_SELLER_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Microsoft Store rollout move cannot run::these secrets are empty in this store-publish job:$missing. OWNER STEP for the client secret: GitHub -> Settings -> Environments -> store-publish -> Environment secrets -> add MS_STORE_CLIENT_SECRET (Private/runbooks/store-submission-windows.md). This is a FAILED move, not a skipped one."
            exit 1
          fi
          echo "all four MS_STORE_* secrets present — the rollout move may proceed."
      - name: A rollout move must name the listing it will be recorded against
        shell: bash
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*) echo "⬜ [10]D-9 the rollout move will be recorded against ${LISTING_URL}" ;;
            *) echo "FAIL the listing_url dispatch input is '${LISTING_URL}', not an https URL; a rollout move is recorded against it. Re-dispatch with listing_url set." >&2; exit 1 ;;
          esac
      - name: Install the Microsoft Store Developer CLI (exact pin from tooling/versions.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./tooling/versions.json').msstore_cli"
          if (-not ($ver -match '^\d+\.\d+\.\d+$')) {
            Write-Error "tooling/versions.json key msstore_cli is '$ver'; an exact three-part version is required."
          }
          Write-Host "msstore-cli pin $ver (tooling/versions.json)"
          winget install --exact --id Microsoft.MSStoreCLI --version $ver --accept-source-agreements --accept-package-agreements --disable-interactivity
      - name: Move the Microsoft Store package rollout
        id: promote
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROMOTE: ${{ inputs.promote }}
          PROMOTE_CONFIRM: ${{ inputs.promote_confirm }}
        run: |
          node tooling/release/submit-windows-store.mjs --promote "$env:PROMOTE" --app "${env:APP}" --confirm "$env:PROMOTE_CONFIRM"
          exit $LASTEXITCODE
      - name: Record the rollout move in the [10]D-9 ledger
        if: always() && steps.promote.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
        run: node tooling/ci/record-deployment.mjs "${APP}-windows-store" --state rollout_moved --listing-url "$LISTING_URL" --mode production

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [gate, build-arm64, dry-run, submit, promote]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: gate=${{ needs.gate.result }} build-arm64=${{ needs.build-arm64.result }} dry-run=${{ needs.dry-run.result }} submit=${{ needs.submit.result }} promote=${{ needs.promote.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
