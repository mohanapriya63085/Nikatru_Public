            exit 1
          }
          node tooling/release/submit-windows-store.mjs --submit --app "${env:APP}" --confirm "$env:CONFIRM" --rollout-percentage "$env:ROLLOUT_PERCENTAGE"
          exit $LASTEXITCODE
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.submit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
          BUILD_NUMBER: ${{ needs.dry-run.outputs.build_number }}
          MSIX: apps/${{ needs.gate.outputs.app }}/build/windows/msix/${{ needs.gate.outputs.app }}.msixbundle
        run: node tooling/ci/record-deployment.mjs "${APP}-windows-store" --state certifying --listing-url "$LISTING_URL" --mode production --artifact "$MSIX" --build-number "$BUILD_NUMBER" --symbols-record "${RUNNER_TEMP}/symbols-record.json"

