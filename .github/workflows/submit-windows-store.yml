        id: nikatru-unsaved-6
        if: ${{ (success()) && steps.nikatru-seal-6.outcome == 'success' && steps.nikatru-saved-6-1.outputs.cache-hit != 'true' && steps.nikatru-saved-6-2.outputs.cache-hit != 'true' && steps.nikatru-saved-6-3.outputs.cache-hit != 'true' }}
