          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  submit:
    name: Submit to the Microsoft Store (owner-approved)
    runs-on: windows-2025
    timeout-minutes: 30
    needs: [nikatru-pin, gate, dry-run]
    if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.confirm == 'SUBMIT-TO-MICROSOFT-STORE'
    concurrency:
      group: store-cadence
      cancel-in-progress: false
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        shell: bash
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: Preflight — every Microsoft Store credential must be present
        shell: bash
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        run: |
          set -euo pipefail
          missing=''
          if [ -z "$MS_STORE_TENANT_ID" ];     then missing="$missing MS_STORE_TENANT_ID"; fi
          if [ -z "$MS_STORE_CLIENT_ID" ];     then missing="$missing MS_STORE_CLIENT_ID"; fi
          if [ -z "$MS_STORE_CLIENT_SECRET" ]; then missing="$missing MS_STORE_CLIENT_SECRET"; fi
          if [ -z "$MS_STORE_SELLER_ID" ];     then missing="$missing MS_STORE_SELLER_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Microsoft Store submission cannot run::these secrets are empty in this store-publish job:$missing. MS_STORE_CLIENT_SECRET is a store-publish ENVIRONMENT secret (tooling/channel-register.json scopes it there) and the three ids are repository secrets (the Store ID is the app's own record, stores.windows-store.productId). OWNER STEP for the client secret: GitHub -> Settings -> Environments -> store-publish -> Environment secrets -> add MS_STORE_CLIENT_SECRET. The values come from an Entra application associated with the Partner Center account (Private/runbooks/store-submission-windows.md). This is a FAILED submission, not a skipped one."
            exit 1
          fi
          echo "all four MS_STORE_* secrets present — the submission may proceed."
      - name: A real submission must name the listing it will be recorded against
        shell: bash
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL submission." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could submit and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g.  https://apps.microsoft.com/detail/<product-id>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     dashboard is behind an account nobody can open." >&2
              exit 1
              ;;
          esac
      - name: Name clearance holds for windows-store (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=windows-store
      - name: Every supported language is translated by the pipeline (windows-store, real submission)
        run: node tooling/ci/assert-translations-generated.mjs --for-submission=windows-store --real-submission
      - name: The app's Partner Center declarations are recorded (--for-submission)
        shell: bash
        run: node tooling/ci/assert-sworn-store-files.mjs --for-submission=windows-store --app "$APP" --real-submission
      - name: The Microsoft Store screenshot set covers its declared device types
        shell: bash
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=windows-store
      - name: A build that cannot sign in is not committed for certification (windows-store)
        shell: bash
        run: node tooling/ci/assert-channel-register.mjs --for-submission=windows-store --real-submission
      - name: Every target this channel ships to has its golden-path legs graded (windows-store)
        shell: bash
        run: node tooling/ci/assert-e2e-legs.mjs --for-submission=windows-store
      - name: Restore the ${{ needs.dry-run.outputs.artifact }} hand-off (generated)
        id: nikatru-restore-7
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the ${{ needs.dry-run.outputs.artifact }} hand-off (generated)
        id: nikatru-unseal-7
        if: ${{ (success()) && steps.nikatru-restore-7.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-7.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the ${{ needs.dry-run.outputs.artifact }} hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-7.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/windows/msix
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: The package is the one the dry-run job hashed (sha256)
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.dry-run.outputs.sha256 }}
          MSIX: apps/${{ needs.gate.outputs.app }}/build/windows/msix/${{ needs.gate.outputs.app }}.msixbundle
        run: |
          set -euo pipefail
          if ! grep -Eqx '[0-9a-f]{64}' <<<"$EXPECTED_SHA256"; then
            echo "FAIL the dry-run job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$MSIX" | sha256sum --check --strict -
      - name: Restore the symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run hand-off (generated)
        id: nikatru-restore-8
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run hand-off (generated)
        id: nikatru-unseal-8
        if: ${{ (success()) && steps.nikatru-restore-8.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-8.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-8.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/symbols/windows
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: Copy this build's symbols to the release store (R2), before the upload
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          BUILD_NUMBER: ${{ needs.dry-run.outputs.build_number }}
        run: |
          set -euo pipefail
          release_line="$(node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" | sed -n 's/^release_line=//p')"
          node tooling/ci/r2-durable-copy.mjs --kind symbols --app "$APP" --channel windows-store \
            --version "${release_line}.${BUILD_NUMBER}" --build "$BUILD_NUMBER" \
            --dir "apps/${APP}/build/symbols/windows" --out "${RUNNER_TEMP}/symbols-record.json"
      - name: The windows-store artifact is within its store's size limit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MSIX: apps/${{ needs.gate.outputs.app }}/build/windows/msix/${{ needs.gate.outputs.app }}.msixbundle
        run: node tooling/ci/assert-artifact-size.mjs --app "$APP" --channel windows-store "$MSIX"
      - name: Install the Microsoft Store Developer CLI (exact pin from tooling/versions.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./tooling/versions.json').msstore_cli"
          if (-not ($ver -match '^\d+\.\d+\.\d+$')) {
            Write-Error "tooling/versions.json key msstore_cli is '$ver'; an exact three-part version is required. A range resolves at run time, so the rehearsal and the submission could speak to different tools."
          }
          Write-Host "msstore-cli pin $ver (tooling/versions.json)"
          winget install --exact --id Microsoft.MSStoreCLI --version $ver --accept-source-agreements --accept-package-agreements --disable-interactivity
      - name: Submit to the Microsoft Store
        id: submit
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or [string]::IsNullOrWhiteSpace($env:GITHUB_REPOSITORY)) {
