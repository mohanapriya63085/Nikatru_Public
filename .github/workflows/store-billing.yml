        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter build ios --simulator --debug
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-billing.storekit.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Add the one StoreKit harness to RunnerTests
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          cat tooling/store-billing/ios/StoreBillingTests.swift >> "apps/${APP}/ios/RunnerTests/RunnerTests.swift"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-billing.storekit.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: xcodebuild test — StoreBillingTests
        id: xctest
        timeout-minutes: 25
        env:
          TEST_RUNNER_STOREKIT_CONFIG: ${{ github.workspace }}/tooling/store-billing/generated/${{ matrix.app }}.storekit
          TEST_RUNNER_STOREKIT_JWS_OUT: ${{ runner.temp }}/storekit-jws-${{ matrix.app }}.json
          UDID: ${{ steps.sim.outputs.udid }}
          XCODEBUILD_BUDGET_S: '1380'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          log="${RUNNER_TEMP}/xcodebuild.log"
          xcodebuild test \
            -workspace "apps/${APP}/ios/Runner.xcworkspace" \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -only-testing:RunnerTests/StoreBillingTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "${RUNNER_TEMP}/StoreBillingTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO >"$log" 2>&1 &
          xb=$!
          ( sleep "$XCODEBUILD_BUDGET_S"; echo "WATCHDOG: xcodebuild ran past ${XCODEBUILD_BUDGET_S}s; stopping it" >>"$log"; kill -TERM "$xb" ) >/dev/null 2>&1 &
          dog=$!
          code=0
          wait "$xb" || code=$?
          pkill -P "$dog" 2>/dev/null || true
          kill "$dog" 2>/dev/null || true
          grep -E '^(Test Case .*(passed|failed)|Executed [0-9]+ tests?)|error:|WATCHDOG' "$log" | tail -n 80 || true
          [ "$code" -eq 0 ] || { echo "::error title=StoreKit harness::xcodebuild test exited ${code}; the tail of xcodebuild.log follows in the next step"; exit "$code"; }
          out="${RUNNER_TEMP}/storekit-jws-${APP}.json"
          [ -s "$out" ] || { echo "::error title=StoreKit harness::the harness wrote no transaction JWS to ${out}, so the server cannot be shown refusing one"; exit 1; }
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-billing.storekit.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The tail of xcodebuild.log (red or cancelled run)
        if: always() && (steps.xctest.outcome == 'failure' || steps.xctest.outcome == 'cancelled')
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          log="${RUNNER_TEMP}/xcodebuild.log"
          if [ -s "$log" ]; then
            tail -n 300 "$log"
          else
            echo "xcodebuild.log is empty or missing: xcodebuild never started"
          fi
          exit 1
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-billing.storekit.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store storekit-xcresult-${{ matrix.app }} in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/StoreBillingTests.xcresult
          NIKATRU_ARTIFACT_NAME: storekit-xcresult-${{ matrix.app }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          npm ci
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-billing.storekit.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
        working-directory: services/platform
      - name: POST every Xcode-signed transaction to /v1/receipts/apple_iap → 403
        working-directory: services/platform
        env:
          STOREKIT_XCODE_JWS_FILE: ${{ runner.temp }}/storekit-jws-${{ matrix.app }}.json
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          npx vitest run test/store-billing-apple-local-jws.test.ts
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-billing.storekit.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-billing.storekit.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  apple-notification:
    name: Apple test notification reaches us and is verified — ${{ matrix.app }}
    needs: generated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.generated.outputs.apps) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: Request a Test Notification (sandbox) and read its status
        env:
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          STORE_BILLING_BUNDLE_ID: com.nikatru.${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/store-billing-proofs.mjs apple-test-notification
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-billing.apple-notification.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-billing.apple-notification.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

