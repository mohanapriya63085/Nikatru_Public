        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-billing.client.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  storekit:
    name: StoreKit Testing — ${{ matrix.app }} (simulator)
    needs: [nikatru-pin, generated]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.generated.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      STOREKIT_XCODE: '26.2'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
      - name: StoreKit Testing runs on the pinned Xcode
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          [ -d "$DEVELOPER_DIR" ] || { echo "::error title=StoreKit harness::${DEVELOPER_DIR} is not on this runner, so StoreKit Testing would run on an Xcode whose StoreKitTest fails Code=3 (FB22237318)"; exit 1; }
          have="$(xcodebuild -version | sed -n 1p)"
          [ "$have" = "Xcode ${STOREKIT_XCODE}" ] || { echo "::error title=StoreKit harness::DEVELOPER_DIR selects ${have}, not Xcode ${STOREKIT_XCODE}"; exit 1; }
          echo "::nikatru-detail::StoreKit Testing on ${have} ($(xcodebuild -version | tail -n 1))"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        with:
          cache: 'false'
      - name: flutter pub get
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Boot an iPhone simulator on the runtime that matches the SDK
        id: sim
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes | sed 's/^/::nikatru-detail::STOREKIT-DIAG runtimes: /'
          { ls /Applications | grep Xcode || true; } | sed 's/^/::nikatru-detail::STOREKIT-DIAG Xcodes: /'
          picked="${RUNNER_TEMP}/pick-simulator.txt"
          if ! udid="$(xcrun simctl list devices available -j | node tooling/store-billing/pick-simulator.mjs --sdk "$sdk" 2>"$picked")"; then xcrun simctl list runtimes; cat "$picked"; exit 1; fi
          sed 's/^/::nikatru-detail::STOREKIT-DIAG /' "$picked"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          open -a "${DEVELOPER_DIR}/Applications/Simulator.app" --args -CurrentDeviceUDID "$udid"
          echo "::nikatru-detail::STOREKIT-DIAG simulator: SDK iphonesimulator${sdk} · $(xcrun simctl list devices | grep -F "$udid" | sed 's/^ *//')"
          runtime="$(xcrun simctl list devices -j | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices; for (const [rt, l] of Object.entries(d)) if (l.some((x) => x.udid === process.argv[1])) console.log(rt.split(".").pop())' "$udid")"
          [ "$runtime" = "iOS-$(printf '%s' "$sdk" | cut -d. -f1-2 | tr . -)" ] || { echo "::error title=StoreKit harness::SDK iphonesimulator${sdk} does not match the booted runtime ${runtime}"; exit 1; }
          echo "::nikatru-detail::STOREKIT-DIAG sdk/runtime match: SDK iphonesimulator${sdk} ↔ runtime ${runtime}"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build the simulator app (pods, Generated.xcconfig)
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter build ios --simulator --debug
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Add the one StoreKit harness to RunnerTests
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          cat tooling/store-billing/ios/StoreBillingTests.swift >> "apps/${APP}/ios/RunnerTests/RunnerTests.swift"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Sign the test host for StoreKit Testing (simulator get-task-allow)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store-billing/sim-entitlements.mjs --app "$APP"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build the StoreKit test host (build-for-testing)
        timeout-minutes: 15
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          log="${RUNNER_TEMP}/xcodebuild-build.log"
          code=0
          xcodebuild build-for-testing \
            -workspace "apps/${APP}/ios/Runner.xcworkspace" \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- >"$log" 2>&1 || code=$?
          [ "$code" -eq 0 ] || { tail -n 200 "$log"; echo "::error title=StoreKit harness::xcodebuild build-for-testing exited ${code}"; exit "$code"; }
          { grep -E '^(CodeSign|ProcessProductPackaging)' "$log" || true; } | sed 's/^/::nikatru-detail::/'
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The test host carries get-task-allow (codesign -d --entitlements)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          app="${RUNNER_TEMP}/DerivedData/Build/Products/Debug-iphonesimulator/Runner.app"
          { codesign -d --entitlements - "$app" 2>&1 || true; } | sed 's/^/::nikatru-detail::codesign: /'
          node tooling/store-billing/host-entitlements.mjs --app "$app" 2>&1 | sed 's/^/::nikatru-detail::/'
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: xcodebuild test — StoreBillingTests
        id: xctest
        timeout-minutes: 25
        env:
          TEST_RUNNER_STOREKIT_CONFIG: ${{ github.workspace }}/tooling/store-billing/generated/${{ matrix.app }}.storekit
          TEST_RUNNER_STOREKIT_JWS_OUT: ${{ runner.temp }}/storekit-jws-${{ matrix.app }}.json
          TEST_RUNNER_STOREKIT_SKIPS_OUT: ${{ runner.temp }}/storekit-skips-${{ matrix.app }}.json
          UDID: ${{ steps.sim.outputs.udid }}
          XCODEBUILD_BUDGET_S: '1380'
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          log="${RUNNER_TEMP}/xcodebuild.log"
          only="RunnerTests/StoreBillingTests"
          if [ -n "${ONLY_TESTING:-}" ]; then
            [[ "$ONLY_TESTING" =~ ^test[A-Za-z0-9_]+$ ]] && grep -qE "^  func ${ONLY_TESTING}\(\) async throws \{" tooling/store-billing/ios/StoreBillingTests.swift \
              || { echo "::error title=StoreKit harness::only_testing '${ONLY_TESTING}' is not a test method of StoreBillingTests"; exit 1; }
            only="${only}/${ONLY_TESTING}"
            echo "::warning title=StoreKit harness::only_testing: running ${only} ALONE (diagnosis; the scenario gates still judge the whole list)"
          fi
          xcodebuild test \
            -workspace "apps/${APP}/ios/Runner.xcworkspace" \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            "-only-testing:${only}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "${RUNNER_TEMP}/StoreBillingTests.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- >"$log" 2>&1 &
          xb=$!
          ( sleep "$XCODEBUILD_BUDGET_S"; echo "WATCHDOG: xcodebuild ran past ${XCODEBUILD_BUDGET_S}s; stopping it" >>"$log"; kill -TERM "$xb" ) >/dev/null 2>&1 &
          dog=$!
          code=0
          wait "$xb" || code=$?
          pkill -P "$dog" 2>/dev/null || true
          kill "$dog" 2>/dev/null || true
          echo "StoreKit host: $(xcodebuild -version | sed -n 1p) · simulator $(xcrun simctl list devices | grep -F "$UDID" | sed 's/^ *//') · runtime $(xcrun simctl list devices -j | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices; for (const [rt, l] of Object.entries(d)) if (l.some((x) => x.udid === process.argv[1])) console.log(rt.split(".").pop())' "$UDID")"
          grep -E '^(Test Case .*(passed|failed)|Executed [0-9]+ tests?)|error:|WATCHDOG' "$log" | tail -n 80 || true
          [ "$code" -eq 0 ] || { echo "::error title=StoreKit harness::xcodebuild test exited ${code}; the tail of xcodebuild.log follows in the next step"; exit "$code"; }
          out="${RUNNER_TEMP}/storekit-jws-${APP}.json"
          [ -s "$out" ] || { echo "::error title=StoreKit harness::the harness wrote no transaction JWS to ${out}, so the server cannot be shown refusing one"; exit 1; }
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every scenario recorded a transaction, or a skip allowed on this Xcode
        env:
          JWS: ${{ runner.temp }}/storekit-jws-${{ matrix.app }}.json
          SKIPS: ${{ runner.temp }}/storekit-skips-${{ matrix.app }}.json
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store-billing/assert-scenarios.mjs --jws "$JWS" --skips "$SKIPS" --xcode "$(xcodebuild -version | sed -n 1p)"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The tail of xcodebuild.log (red or cancelled run)
        if: always() && (steps.xctest.outcome == 'failure' || steps.xctest.outcome == 'cancelled')
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          log="${RUNNER_TEMP}/xcodebuild.log"
          if [ -s "$log" ]; then
            tail -n 300 "$log"
          else
            echo "xcodebuild.log is empty or missing: xcodebuild never started"
          fi
          exit 1
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store storekit-xcresult-${{ matrix.app }} in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/StoreBillingTests.xcresult
          NIKATRU_ARTIFACT_NAME: storekit-xcresult-${{ matrix.app }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
        working-directory: services/platform
      - name: POST every Xcode-signed transaction to /v1/receipts/apple_iap → 403
        working-directory: services/platform
        env:
          STOREKIT_XCODE_JWS_FILE: ${{ runner.temp }}/storekit-jws-${{ matrix.app }}.json
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          npx vitest run test/store-billing-apple-local-jws.test.ts
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.storekit.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-billing.storekit.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  apple-notification:
    name: Apple test notification reaches us and is verified — ${{ matrix.app }}
    needs: [nikatru-pin, generated]
    if: (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.generated.outputs.apps) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
      - name: Request a Test Notification (sandbox) and read its status
        env:
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          STORE_BILLING_BUNDLE_ID: com.nikatru.${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/store-billing-proofs.mjs apple-test-notification
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name store-billing.apple-notification.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-billing.apple-notification.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

