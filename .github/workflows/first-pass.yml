name: Remote first pass

run-name: "Remote first pass · ${{ inputs.head }} · ${{ inputs.base }}"

on:
  workflow_dispatch:
    inputs:
      head:
        description: 'The pushed head (40 hex): the second parent of the commit this run builds.'
        required: true
        type: string
      base:
        description: 'The main it was merged into (40 hex): the first parent of the commit this run builds.'
        required: true
        type: string
      branch:
        description: 'The branch the head is pushed to (the lane or train branch, without refs/heads/).'
        required: false
        default: ''
        type: string
      private_ref:
        description: The PRIVATE ref this run builds, refs/heads/<branch> (generated; empty is the private main).
        required: false
        default: ''
        type: string

