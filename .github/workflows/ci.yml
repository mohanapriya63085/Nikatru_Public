  nikatru-report-deploys:
    name: Report to the private repository (generated)
    needs: [platform-db-migrate, deploy-web, money-sandbox, money-gate, deploy-workers, nikatru-collect-deploys]
    if: always() && github.event_name == 'repository_dispatch' && !(needs.platform-db-migrate.result == 'skipped' && needs.deploy-web.result == 'skipped' && needs.money-sandbox.result == 'skipped' && needs.money-gate.result == 'skipped' && needs.deploy-workers.result == 'skipped') && (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main') || github.event.client_payload.event == 'pull_request')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out this shell repository only, no private code (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/nikatru
      - name: Report every lane and the gate to the private repository (generated)
        id: send
        if: always()
        env:
          BRIDGE_REPORT_SECRET: ${{ secrets.BRIDGE_REPORT_SECRET }}
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL: ${{ needs.nikatru-collect-deploys.outputs.detail }}
          NIKATRU_HEAD_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref }}
          NIKATRU_RESULTS: '{"platform-db-migrate": "${{ needs.platform-db-migrate.result }}", "deploy-web": "${{ needs.deploy-web.result }}", "money-sandbox": "${{ needs.money-sandbox.result }}", "money-gate": "${{ needs.money-gate.result }}", "deploy-workers": "${{ needs.deploy-workers.result }}"}'
        run: /usr/bin/python3 -I .github/nikatru/report.py send .github/nikatru/ci-deploys.json
      - name: Report every lane and the gate without detail, as the step above did not run to its end (generated)
        if: always() && steps.send.outputs.reported != 'true'
        env:
          BRIDGE_REPORT_SECRET: ${{ secrets.BRIDGE_REPORT_SECRET }}
          NIKATRU_HEAD_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref }}
          NIKATRU_RESULTS: '{"platform-db-migrate": "${{ needs.platform-db-migrate.result }}", "deploy-web": "${{ needs.deploy-web.result }}", "money-sandbox": "${{ needs.money-sandbox.result }}", "money-gate": "${{ needs.money-gate.result }}", "deploy-workers": "${{ needs.deploy-workers.result }}"}'
        run: /usr/bin/python3 -I .github/nikatru/report.py send .github/nikatru/ci-deploys.json

  nikatru-relay:
    name: Start the workflows that follow this run (generated)
    needs: [nikatru-pin, first-pass, lane-workers, lane-guards, lane-sites, lane-apps, lane-build, extensions, ci-gate, platform-db-migrate, deploy-web, pool-sync, money-plan, sandbox-slot, money-sandbox, money-gate, deploy-workers, nikatru-ran, nikatru-collect, nikatru-report, nikatru-collect-deploys, nikatru-report-deploys]
    if: always() && (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main') || github.event.client_payload.event == 'pull_request') && github.event.client_payload.event != 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Start autopilot-watch.yml after this run (generated)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NIKATRU_RELAY_RUN: ${{ github.run_id }}
          NIKATRU_RELAY_ATTEMPT: ${{ github.run_attempt }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-watch.yml/dispatches" -f ref=main -f "inputs[nikatru_relay_run]=$NIKATRU_RELAY_RUN" -f "inputs[nikatru_relay_attempt]=$NIKATRU_RELAY_ATTEMPT" --silent || echo "::warning::could not start autopilot-watch.yml after run $NIKATRU_RELAY_RUN attempt $NIKATRU_RELAY_ATTEMPT"
      - name: Start main-healthy.yml after this run (generated)
