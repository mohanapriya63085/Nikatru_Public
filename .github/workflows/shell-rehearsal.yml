          NIKATRU_RESULTS: '{"plan": "${{ needs.plan.result }}", "rehearse": "${{ needs.rehearse.result }}", "await": "${{ needs.await.result }}", "shell-rehearsal": "${{ needs.shell-rehearsal.result }}"}'
        run: /usr/bin/python3 -I .github/nikatru/report.py send .github/nikatru/shell-rehearsal.json
