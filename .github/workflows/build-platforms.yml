        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        with:
          android-ndk: 'true'
      - name: Linux build deps
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Resolve the workspace
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Derive the release line from pubspec
        id: ver
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Resolve this app's base href from the catalogue
        id: base
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-catalog-reachable.mjs --emit-base-href ${{ matrix.app }} >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build web
        env:
          BASE_HREF: ${{ steps.base.outputs.base_href }}
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} web web
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build linux
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} linux linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Prepare the AppImage signing key
        env:
          APPIMAGE_SIGNING_KEY_B64: ${{ secrets.APPIMAGE_SIGNING_KEY_B64 }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/appimage-signing.mjs --app ${{ matrix.app }} --channel linux-appimage
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Generate the snapcraft recipe
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/release/generate-snapcraft.mjs --app ${{ matrix.app }} --bundle apps/${{ matrix.app }}/build/linux/x64/release/bundle --out "$RUNNER_TEMP/snapcraft-${{ matrix.app }}" --version ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The generated recipe is complete, still derived, and packable here
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-snapcraft-generable.mjs --emitted "$RUNNER_TEMP/snapcraft-${{ matrix.app }}/snap/snapcraft.yaml" --app ${{ matrix.app }} --pack-runner ubuntu-24.04
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install snapcraft (the track tooling/versions.json pins)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          track="$(node -p "require('./tooling/versions.json').snapcraft_track")"
          echo "snapcraft track ${track} (tooling/versions.json snapcraft_track)"
          sudo snap install snapcraft --classic --channel "$track"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Pack the snap (no upload)
        env:
          APP: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          project="${RUNNER_TEMP}/snapcraft-${APP}"
          collected="${GITHUB_WORKSPACE}/apps/${APP}/build/linux/snap/${APP}.snap"
          cd "$project"
          sudo snapcraft pack --destructive-mode
          count="$(find "$project" -maxdepth 1 -type f -name '*.snap' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "FAIL snapcraft exited 0 and left ${count} .snap file(s) in ${project}; exactly one is required." >&2
            find "$project" -maxdepth 1 -type f -name '*.snap' >&2
            exit 1
          fi
          built="$(find "$project" -maxdepth 1 -type f -name '*.snap')"
          mkdir -p "$(dirname "$collected")"
          sudo mv "$built" "$collected"
          sudo chown "$(id -u):$(id -g)" "$collected"
          ls -l "$collected"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The packed snap loads only libraries it carries (ldd on the primed binary)
        env:
          APP: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          prime="${RUNNER_TEMP}/snapcraft-${APP}/prime"
          snaps="$(node tooling/ci/assert-snap-primed-libs.mjs --prime "$prime" --emit-snaps)"
          for s in $snaps; do sudo snap install "$s"; done
          node tooling/ci/assert-snap-primed-libs.mjs --prime "$prime"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/android-signing.mjs --app ${{ matrix.app }} --channel android-play
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build android (apk — sideloadable build proof)
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} apk android-play
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build android (aab — the Google Play artifact)
        id: build_aab
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} appbundle android-play
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stamp the .aab with the channel its build compiled in
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/stamp-channel.mjs --channel android-play --build-step build_aab apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.19 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Prepare the apps.gov.in signing key (its own key, never the upload key)
        id: agi_key
        env:
          APP: ${{ matrix.app }}
          APPSGOVIN_KEYSTORE_BASE64: ${{ secrets.APPSGOVIN_KEYSTORE_BASE64 }}
          APPSGOVIN_KEYSTORE_PASSWORD: ${{ secrets.APPSGOVIN_KEYSTORE_PASSWORD }}
          APPSGOVIN_KEY_ALIAS: ${{ secrets.APPSGOVIN_KEY_ALIAS }}
          APPSGOVIN_KEY_PASSWORD: ${{ secrets.APPSGOVIN_KEY_PASSWORD }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          scratch="${RUNNER_TEMP}/apps-gov-in-signing.env"
          : > "$scratch"
          node tooling/ci/android-signing.mjs --app "$APP" --channel apps-gov-in \
            --out "${RUNNER_TEMP}/apps-gov-in-key" --github-output "$scratch"
          posture="$(sed -n 's/^ANDROID_SIGNING_POSTURE=//p' "$scratch")"
          keystore="$(sed -n 's/^ANDROID_KEYSTORE_PATH=//p' "$scratch")"
          rm -f "$scratch"
          case "$posture" in
            release-signed)
              if [ -z "$keystore" ]; then
                echo "::error title=apps.gov.in key::posture release-signed but no ANDROID_KEYSTORE_PATH was exported"
                exit 1
              fi
              echo "posture=release" >> "$GITHUB_OUTPUT" ;;
            debug-signed-build-proof)
              echo "### apps.gov.in signing: THE APPSGOVIN_* SECRETS ARE NOT SET. THE .apk BELOW IS DEBUG-SIGNED AND NAMED NOT-FOR-UPLOAD." >> "$GITHUB_STEP_SUMMARY"
              echo "posture=debug" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error title=apps.gov.in key::android-signing.mjs exported no posture (got \"${posture}\")"
              exit 1 ;;
          esac
          echo "keystore_path=${keystore}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.20 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Set the Play .apk aside (Flutter writes every .apk to one path)
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          rm -rf build/android-play-apk-aside
          mkdir -p build/android-play-apk-aside
          mv build/app/outputs/flutter-apk/app-release.apk build/android-play-apk-aside/
          if [ -f build/app/outputs/flutter-apk/app-release.apk.sha1 ]; then mv build/app/outputs/flutter-apk/app-release.apk.sha1 build/android-play-apk-aside/; fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.21 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build android (apk — apps.gov.in, its own key, sells on the India rail)
        id: build_apk_agi
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.agi_key.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APPSGOVIN_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.APPSGOVIN_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.APPSGOVIN_KEY_PASSWORD }}
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} apk apps-gov-in
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.22 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Take the apps.gov.in .apk out, and put the Play .apk back
        id: agi_apk
        working-directory: apps/${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          BUILD_NAME: ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          file="${APP}-apps-gov-in-${BUILD_NAME}.apk"
          mkdir -p build/apps-gov-in
          mv build/app/outputs/flutter-apk/app-release.apk "build/apps-gov-in/${file}"
          rm -f build/app/outputs/flutter-apk/app-release.apk.sha1
          mv build/android-play-apk-aside/* build/app/outputs/flutter-apk/
          rmdir build/android-play-apk-aside
          if cmp -s build/app/outputs/flutter-apk/app-release.apk "build/apps-gov-in/${file}"; then
            echo "::error title=apps.gov.in apk::the restored Play .apk is byte-identical to the apps.gov.in one"
            exit 1
          fi
          echo "apk=apps/${APP}/build/apps-gov-in/${file}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.23 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stamp the apps.gov.in .apk with the channel its build compiled in
        env:
          APK: ${{ steps.agi_apk.outputs.apk }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/stamp-channel.mjs --channel apps-gov-in --build-step build_apk_agi "$APK"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name build-platforms.linux_web_android.24 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage symbols-${{ matrix.app }}-linux-android for this run's later jobs (generated)
        id: nikatru-stage-1
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            apps/${{ matrix.app }}/build/symbols/linux
            apps/${{ matrix.app }}/build/symbols/android-apk
            apps/${{ matrix.app }}/build/symbols/android-aab
