          set -euo pipefail
          {
            echo "Built from commit \`${NIKATRU_SHA}\`, which passed \`ci-gate\` before any binary in this release existed."
            echo
            echo "Verify every download with a tool you already have:"
            echo
            echo "    sha256sum -c SHA256SUMS"
            echo
            echo "and check that this repository's release workflow built it (docs/release/verify-a-download.md):"
            echo
            echo "    gh attestation verify <file> --repo ${GH_REPO} --signer-workflow ${GH_REPO}/.github/workflows/build-platforms.yml --source-ref refs/tags/${RELEASE_TAG}"
