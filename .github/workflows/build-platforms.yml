          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: The release directory, or the declared empty
        if: ${{ !((startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app) }}
        env:
          APP: ${{ matrix.app }}
        run: echo "::notice title=Nothing to attest (${APP})::the release job staged nothing and owes nothing on this non-tag run, so it handed over no directory"
      - name: Restore the release-dist-${{ matrix.app }} hand-off (generated)
        id: nikatru-restore-9
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/sealed
          key: nikatru-handoff-release-dist-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-release-dist-${{ matrix.app }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Unseal the release-dist-${{ matrix.app }} hand-off (generated)
        id: nikatru-unseal-9
        if: ${{ ((startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app) && steps.nikatru-restore-9.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY: ${{ steps.nikatru-restore-9.outputs.cache-matched-key }}
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-release-dist-${{ matrix.app }}-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the release-dist-${{ matrix.app }} hand-off where download-artifact put it (generated)
        if: ${{ ((startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app) && steps.nikatru-unseal-9.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: dist
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: Attest the build provenance of every release file
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - name: Verify every release file's provenance
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: >
          node tooling/ci/verify-provenance.mjs --dir dist --repo "$REPO"
          --signer-workflow "${REPO}/.github/workflows/build-platforms.yml"
          --attestation-id "$ATTESTATION_ID" --attestation-url "$ATTESTATION_URL"
          --out "${RUNNER_TEMP}/provenance.json"

