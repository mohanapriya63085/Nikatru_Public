          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: prepare=${{ needs.prepare.result }} account=${{ needs.account.result }} reminder-digest=${{ needs.reminder-digest.result }} first-sign-in=${{ needs.first-sign-in.result }} email-sign-up=${{ needs.email-sign-up.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
