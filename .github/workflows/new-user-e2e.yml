          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name new-user-e2e.email-sign-up.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install the app Worker
        working-directory: services/subscriptiontracker-api
        run: |
