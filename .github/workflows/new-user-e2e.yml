          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name new-user-e2e.email-sign-up.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install the platform Worker
