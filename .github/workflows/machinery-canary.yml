        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.machinery_sha }}
          path: .canary-machinery
          sparse-checkout: .github/ISSUE_TEMPLATE
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
        timeout-minutes: 3
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        timeout-minutes: 2
      - name: Join the machinery head's objects to the main checkout, and keep main's judge
        timeout-minutes: 2
        env:
          MACHINERY: ${{ inputs.machinery_sha }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          printf '%s\n' "$PWD/.canary-machinery/.git/objects" >> "$(git rev-parse --git-path objects/info/alternates)"
          printf '/.canary-machinery/\n' >> "$(git rev-parse --git-path info/exclude)"
          git cat-file -e "$MACHINERY^{commit}"
          missing="$(git rev-list --objects --missing=print "$MACHINERY" ^HEAD | grep -c '^?' || true)"
          if [ "$missing" != "0" ]; then echo "::error title=machinery canary::COVERAGE LOST: $missing object(s) of $MACHINERY are missing here (a force-pushed or deleted head?)"; exit 2; fi
          cp tooling/ci/machinery-canary.mjs "$RUNNER_TEMP/machinery-canary.mjs"
          git rev-parse HEAD > "$RUNNER_TEMP/main.sha"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.arch.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
