env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: Machinery canary

run-name: "Machinery canary · ${{ inputs.machinery_sha }} · ${{ inputs.peers }}"

on:
  workflow_dispatch:
    inputs:
      machinery_sha:
        description: The CI-machinery PR's exact head sha (40 hex).
        required: true
        type: string
      peers:
        description: A comma list of 1-6 peer PR head shas (40 hex each).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: machinery-canary-${{ inputs.machinery_sha }}
  cancel-in-progress: false

