    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    outputs:
      verdict_0: ${{ steps.hand.outputs.verdict_0 }}
      verdict_1: ${{ steps.hand.outputs.verdict_1 }}
      verdict_2: ${{ steps.hand.outputs.verdict_2 }}
      verdict_3: ${{ steps.hand.outputs.verdict_3 }}
      verdict_4: ${{ steps.hand.outputs.verdict_4 }}
      verdict_5: ${{ steps.hand.outputs.verdict_5 }}
