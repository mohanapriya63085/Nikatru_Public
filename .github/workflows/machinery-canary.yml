      - name: CANDIDATE — the peer merged with main and the machinery head
        timeout-minutes: 16
        env:
          MACHINERY: ${{ inputs.machinery_sha }}
          PEER: ${{ matrix.peer }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$RUNNER_TEMP/machinery-canary.mjs" --leg candidate --peer "$PEER" --machinery "$MACHINERY" --main "$(cat "$RUNNER_TEMP/main.sha")" --out "$RUNNER_TEMP/candidate.json"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.peer.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The verdict (only CANARY GREEN passes this job)
        timeout-minutes: 1
        id: verdict
        env:
          PEER: ${{ matrix.peer }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$RUNNER_TEMP/machinery-canary.mjs" --compare --expect-peer "$PEER" "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/candidate.json"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.peer.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Put the tree back at main
        timeout-minutes: 1
        if: always()
