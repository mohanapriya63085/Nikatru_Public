        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        timeout-minutes: 6
        if: steps.dart.outputs.dart == 'true'
        with:
          cache: 'false'
      - name: Activate melos
        timeout-minutes: 2
        if: steps.dart.outputs.dart == 'true'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/pub-activate-retry.mjs -- dart pub global activate melos "$(node -p "require('./tooling/versions.json').melos")"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.peer.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: BASELINE — the peer merged with main, first pass as ci.yml runs it
        timeout-minutes: 16
        env:
          PEER: ${{ matrix.peer }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$RUNNER_TEMP/machinery-canary.mjs" --leg baseline --peer "$PEER" --main "$(cat "$RUNNER_TEMP/main.sha")" --out "$RUNNER_TEMP/baseline.json"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
