        timeout-minutes: 1
        id: hand
        if: always()
        env:
          CANARY: ${{ steps.verdict.outputs.canary }}
          OUTCOME: ${{ steps.verdict.outcome }}
          INDEX: ${{ strategy.job-index }}
          PEER: ${{ matrix.peer }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          v="${CANARY:-none} $PEER ${OUTCOME:-none}"
          if [ -z "$CANARY" ] && grep -q '^  "exit": 0,$' "$RUNNER_TEMP/baseline.json" 2>/dev/null && [ ! -s "$RUNNER_TEMP/candidate.json" ]; then v="knock-on $PEER candidate-unfinished"; fi
          if [ "$INDEX" = 0 ]; then echo "verdict_0=$v" >> "$GITHUB_OUTPUT"
          elif [ "$INDEX" = 1 ]; then echo "verdict_1=$v" >> "$GITHUB_OUTPUT"
          elif [ "$INDEX" = 2 ]; then echo "verdict_2=$v" >> "$GITHUB_OUTPUT"
          elif [ "$INDEX" = 3 ]; then echo "verdict_3=$v" >> "$GITHUB_OUTPUT"
          elif [ "$INDEX" = 4 ]; then echo "verdict_4=$v" >> "$GITHUB_OUTPUT"
          elif [ "$INDEX" = 5 ]; then echo "verdict_5=$v" >> "$GITHUB_OUTPUT"
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.peer.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-machinery-canary.peer.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

