            exit 1
          fi
          echo "pinned $NIKATRU_PINNED"
          echo "sha=$NIKATRU_PINNED" >> "$GITHUB_OUTPUT"

  plan:
    needs: [nikatru-pin]
    name: Read the peers into a matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      peers: ${{ steps.peers.outputs.peers }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
