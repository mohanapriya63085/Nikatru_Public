          cp tooling/ci/machinery-canary.mjs "$RUNNER_TEMP/machinery-canary.mjs"
          git rev-parse HEAD > "$RUNNER_TEMP/main.sha"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.peer.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Does the peer bring Dart
        timeout-minutes: 2
        id: dart
        env:
          PEER: ${{ matrix.peer }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$RUNNER_TEMP/machinery-canary.mjs" --plan-dart --peer "$PEER" --main "$(cat "$RUNNER_TEMP/main.sha")"
