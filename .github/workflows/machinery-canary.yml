        timeout-minutes: 16
        env:
          MACHINERY: ${{ inputs.machinery_sha }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$RUNNER_TEMP/machinery-canary.mjs" --arch --machinery "$MACHINERY" --main "$(cat "$RUNNER_TEMP/main.sha")" --out "$RUNNER_TEMP/arch.json"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.arch.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The verdict (only CANARY GREEN passes this job)
        timeout-minutes: 1
        id: verdict
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$RUNNER_TEMP/machinery-canary.mjs" --compare --expect-arch "$RUNNER_TEMP/arch.json"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name machinery-canary.arch.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Put the tree back at main
        timeout-minutes: 1
        if: always()
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          git checkout --force --detach "$(cat "$RUNNER_TEMP/main.sha")"
