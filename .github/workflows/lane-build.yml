      GH_POOL_DISPATCH_TOKEN_POOL_A:
        required: false
      GH_POOL_DISPATCH_TOKEN_POOL_B:
        required: false
      GH_POOL_DISPATCH_TOKEN_POOL_C:
        required: false
      PRIVATE_DEPLOY_KEY:
        required: true
      NIKATRU_DETAIL_KEY:
        required: true

permissions:
  contents: read

