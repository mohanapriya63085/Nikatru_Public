  web-artifacts:
    name: Web artifacts (built, booted, discarded)
    if: needs.detect.outputs.affected == 'true' && !contains(fromJSON(needs.pool-build.outputs.adopted), 'web-artifacts')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    needs: [detect, prepare, pool-build]
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - name: Check out the private tree (generated)
