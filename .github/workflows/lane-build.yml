          & icacls.exe $env:RUNNER_TEMP | Write-Output
          $domain, $user = $me -split '\\', 2
          Write-Output "The job runs as $me; USERDOMAIN\USERNAME read ${env:USERDOMAIN}\${env:USERNAME}"
