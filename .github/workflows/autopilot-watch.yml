    needs: [nikatru-pin]
    name: Laptop state, PR board, run ledger
    if: (github.event.client_payload.ref || 'refs/heads/main') == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: main
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Wait for the run that started this one to complete (generated)
        id: nikatru-relay-wait
        if: inputs.nikatru_relay_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIKATRU_RELAY_RUN: ${{ inputs.nikatru_relay_run }}
          NIKATRU_RELAY_ATTEMPT: ${{ inputs.nikatru_relay_attempt }}
        run: |
          case "$NIKATRU_RELAY_RUN" in ''|*[!0-9]*) echo "::error::nikatru_relay_run is not a run id"; exit 1;; esac
          run="repos/$GITHUB_REPOSITORY/actions/runs/$NIKATRU_RELAY_RUN"
          if [ -z "$NIKATRU_RELAY_ATTEMPT" ]; then NIKATRU_RELAY_ATTEMPT="$(gh api "$run" --jq .run_attempt)" || NIKATRU_RELAY_ATTEMPT=; fi
          case "$NIKATRU_RELAY_ATTEMPT" in ''|0|*[!0-9]*) echo "::error::nikatru_relay_attempt '$NIKATRU_RELAY_ATTEMPT' is not an attempt of run $NIKATRU_RELAY_RUN"; exit 1;; esac
          status=unread
          for _ in $(seq 1 36); do
            status="$(gh api "$run/attempts/$NIKATRU_RELAY_ATTEMPT" --jq .status)" || status=unread
            if [ "$status" = completed ]; then
              newest="$(gh api "$run" --jq '"\(.run_attempt) \(.status)"')" || newest=unread
              case "$newest" in
                "$NIKATRU_RELAY_ATTEMPT "*) echo "run $NIKATRU_RELAY_RUN attempt $NIKATRU_RELAY_ATTEMPT completed"; exit 0;;
                [0-9]*)
                  echo "attempt $NIKATRU_RELAY_ATTEMPT superseded by attempt ${newest%% *}, ${newest#* }: the relay for ${newest%% *} decides"
                  echo "superseded=true" >> "$GITHUB_OUTPUT"
                  exit 0;;
              esac
            fi
            sleep 5
          done
          echo "::error::run $NIKATRU_RELAY_RUN attempt $NIKATRU_RELAY_ATTEMPT did not complete in 180 s (its last status: $status)"
          exit 1
      - name: Check out private main's composite actions (generated)
        if: steps.nikatru-relay-wait.outputs.superseded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: steps.nikatru-relay-wait.outputs.superseded != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: steps.nikatru-relay-wait.outputs.superseded != 'true'
      - name: One watch pass
        if: steps.nikatru-relay-wait.outputs.superseded != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRIDGE_WATCH_SECRET: ${{ secrets.BRIDGE_WATCH_SECRET }}
          NIKATRU_BRIDGE_WATCH_URL: https://gh-bridge.nikatru.workers.dev/watch
          BRIDGE_WATCH_ISSUE_SECRET: ${{ secrets.BRIDGE_WATCH_ISSUE_SECRET }}
          NIKATRU_BRIDGE_WATCH_ISSUE_URL: https://gh-bridge.nikatru.workers.dev/watch-issue
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/autopilot/watch.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name autopilot-watch.watch.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-autopilot-watch.watch.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

