# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/autopilot-watch.yml of nikatru-com/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Autopilot watch

run-name: "Autopilot watch${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}"

on:
  workflow_dispatch:
    inputs:
      worker_slot:
        description: 'Set by the platform Worker cron only: the slot of record it fired for. Empty on a hand dispatch.'
        required: false
        default: ''
        type: string
      nikatru_relay_run:
        description: The shell run that started this one (generated; empty is a person dispatching it).
        required: false
        default: ''
        type: string
      nikatru_relay_attempt:
        description: That run's attempt (generated; empty is its newest).
        required: false
        default: ''
        type: string

concurrency:
  group: autopilot-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out the candidate commit, attempt 1 (generated)
        id: nikatru-pin-checkout-1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.bridge.merge_state == 'ready' && github.event.client_payload.bridge.merge_sha) || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Test the candidate commit, attempt 1 (generated)
        id: nikatru-pin-test-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_CHECKOUT: ${{ steps.nikatru-pin-checkout-1.outcome }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_ATTEMPT: '1'
          NIKATRU_ATTEMPTS: '1'
          NIKATRU_WAIT_S: '10'
        run: |
          if [ "$NIKATRU_CHECKOUT" != success ]; then
            echo "attempt $NIKATRU_ATTEMPT: the candidate could not be checked out"
          else
            sha="$(git rev-parse HEAD)"
            if [ "$NIKATRU_P_EVENT" = pull_request ]; then
              if ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then echo "::error::the dispatch of a pull request names no 40-hex head sha (\"$NIKATRU_P_SHA\"): nothing is pinned"; exit 1; fi
              second="$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | sed -n 2p)"
              if [ "$second" = "$NIKATRU_P_SHA" ]; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "attempt $NIKATRU_ATTEMPT: $sha is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${second:-none})"
            else
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$NIKATRU_ATTEMPT" -lt "$NIKATRU_ATTEMPTS" ]; then sleep "$NIKATRU_WAIT_S"; fi
      - name: Pin the commit every job of this run checks out (generated)
        id: pin
        shell: bash
        env:
          NIKATRU_PINNED: ${{ steps.nikatru-pin-test-1.outputs.sha }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ -n "$NIKATRU_P_SHA" ] && ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the dispatched sha \"$NIKATRU_P_SHA\" is not 40 lowercase hex characters: nothing is pinned"
            exit 1
          fi
          if [ "$NIKATRU_P_MAIN_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a push to main pinned $NIKATRU_PINNED, not the pushed sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
            tip="$(git -C .nikatru-main rev-parse HEAD)"
            if [ "$NIKATRU_PINNED" != "$tip" ]; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not private main's tip $tip (an older commit of main, or a push main has moved past: the tip's own run builds it): nothing is pinned"
              exit 1
            fi
          fi
          if [ "$NIKATRU_P_TAG_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a tag push pinned $NIKATRU_PINNED, not the dispatched sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            tagged="$(git -C .nikatru-tag rev-parse HEAD 2>/dev/null || true)"
            if [ "$tagged" != "$NIKATRU_PINNED" ]; then
              echo "::error::the dispatched tag resolves to ${tagged:-nothing}, not the dispatched sha $NIKATRU_PINNED: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the tagged sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
          fi
          if [ -z "$NIKATRU_PINNED" ]; then
            echo "::error::no candidate became the commit this run builds in 1 attempt(s) (a pull request's merge ref never named the dispatched head $NIKATRU_P_SHA as its second parent): nothing is built — push again, or re-run this workflow"
            exit 1
          fi
          echo "pinned $NIKATRU_PINNED"
          echo "sha=$NIKATRU_PINNED" >> "$GITHUB_OUTPUT"

