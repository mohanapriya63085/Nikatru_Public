          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD) node tooling/status/publish-decision.mjs --readings "$RUNNER_TEMP/readings.json" --prev "$RUNNER_TEMP/prev.json" --github-output "$GITHUB_OUTPUT"
      - name: Deploy the status page to nikatru-status
        if: steps.live.outputs.go == 'true'
