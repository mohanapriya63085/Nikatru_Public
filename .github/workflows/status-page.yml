          node tooling/ci/check-site-integrity.mjs . --only sites/status
          node tooling/status/build-status.mjs --check
      - name: Read the surfaces and the live document, and build the site
        id: build
        run: |
          set -uo pipefail
          set +e
          node tooling/ops/status.mjs --json "$RUNNER_TEMP/readings.json" > "$RUNNER_TEMP/status.log" 2>&1
          code=$?
          echo "status.mjs exit: $code"
          tail -n 3 "$RUNNER_TEMP/status.log"
          curl -fsS --max-time 15 --retry 2 --retry-delay 5 https://status.nikatru.com/status.json -o "$RUNNER_TEMP/prev.json" || rm -f "$RUNNER_TEMP/prev.json"
          rm -rf build/status
          mkdir -p build/status
          cp -R sites/status/. build/status/
          set -e
          node tooling/status/build-status.mjs --out build/status --readings "$RUNNER_TEMP/readings.json" --prev "$RUNNER_TEMP/prev.json" --github-output "$GITHUB_OUTPUT"
