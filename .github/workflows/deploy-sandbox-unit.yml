          command: deploy --env sandbox --var RELEASE:${{ env.NIKATRU_SHA }}
      - name: Smoke — the sandbox Worker answers at THIS commit
        if: matrix.worker.worker != 'none'
        env:
          WORKER: ${{ matrix.worker.worker }}
        run: |
          host="$(node tooling/store/capture-backend.mjs --print-host "$WORKER")"
          node tooling/ops/post-deploy-smoke.mjs --url "$host/v1/health" --field build --expect "$NIKATRU_SHA" --require-ok
