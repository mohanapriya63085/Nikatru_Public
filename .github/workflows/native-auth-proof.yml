          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: env.PROOF_NEEDS_DEVICE == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/enable-kvm
        if: env.PROOF_NEEDS_DEVICE == 'true'
      - name: Boot an emulator
        if: env.PROOF_NEEDS_DEVICE == 'true'
        env:
          API_LEVEL: '34'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/avd"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          emu_log="${RUNNER_TEMP}/emulator.log"
          image="system-images;android-${API_LEVEL};google_apis;x86_64"
          why() {
            echo "::error title=Emulator::$1"
            echo "── emulator.log (tail) ──"
            tail -n 60 "$emu_log" 2>/dev/null || echo "(no emulator.log)"
            exit 1
          }
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          timeout 600 "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$image" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n proof -k "$image" --device pixel_6
          "$sdk/emulator/emulator" -list-avds | awk '$0 == "proof" { hit = 1 } END { exit !hit }' || why "avdmanager created no AVD the emulator can see in ANDROID_AVD_HOME=${ANDROID_AVD_HOME}"
          nohup "$sdk/emulator/emulator" -avd proof -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > "$emu_log" 2>&1 &
          emu_pid=$!
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          adb="$sdk/platform-tools/adb"
          "$adb" start-server
          deadline=$((SECONDS + 420))
          phase="waiting for the device to appear"
          while :; do
            kill -0 "$emu_pid" 2>/dev/null || why "the emulator process exited during: ${phase}"
            state="$("$adb" get-state 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ]; then
              phase="waiting for sys.boot_completed"
              [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ] && break
            fi
            [ "$SECONDS" -gt "$deadline" ] && why "not booted within 420 s (last phase: ${phase}; adb state: ${state:-none})"
            sleep 5
          done
          echo "emulator booted at ${SECONDS}s"
